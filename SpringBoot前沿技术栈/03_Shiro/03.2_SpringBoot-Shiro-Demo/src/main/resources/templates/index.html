<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:shiro="http://www.thymeleaf.org/thymeleaf-extras-shiro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 40px;
            transition: all 0.2s;
        }

        /* 头部区域：标题 + 用户状态 + 登出按钮（左侧） */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e8ecf1;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-left h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1d2129;
            margin: 0;
        }

        /* 用户状态标签 */
        .user-status {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .user-status.guest {
            background: #fff7e6;
            color: #d48806;
        }

        .user-status.authenticated {
            background: #e6f7e6;
            color: #389e0d;
        }

        /* 登出按钮（左侧排列） */
        .logout-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #ff4d4f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: #cf1322;
        }

        /* 消息提示 */
        .msg-box {
            background: #f6f8fa;
            padding: 12px 18px;
            border-radius: 8px;
            margin: 15px 0 25px 0;
            color: #4e5969;
            border-left: 4px solid #1677ff;
        }

        .msg-box p {
            margin: 0;
        }

        /* 功能卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 10px;
        }

        .card-item {
            background: #fafbfc;
            border: 1px solid #e8ecf1;
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .card-item a {
            display: block;
            font-size: 18px;
            font-weight: 500;
            color: #1d2129;
            text-decoration: none;
            padding: 6px 0;
        }

        .card-item a:hover {
            color: #1677ff;
        }

        .card-item .desc {
            font-size: 13px;
            color: #86909c;
            margin-top: 6px;
        }

        /* 无权限时隐藏的占位提示（可选） */
        .no-permission-placeholder {
            color: #c9cdd4;
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-left {
                flex-wrap: wrap;
            }
            .logout-btn {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部：标题 + 状态 + 登出按钮（左侧） -->
        <header class="header">
            <div class="header-left">
                <h1>📋 首页</h1>

                <!-- 使用 Shiro 标签判断登录状态 -->
                <shiro:guest>
                    <span class="user-status guest">未登录</span>
                </shiro:guest>
                <shiro:authenticated>
                    <span class="user-status authenticated">已登录</span>
                </shiro:authenticated>
            </div>

            <!-- 登出按钮 - 左侧排列（在这里与 header-left 形成左右布局） -->
            <!-- 注意：只有已登录用户才显示登出按钮，使用 shiro:authenticated 包裹 -->
            <shiro:authenticated>
                <a th:href="@{/logout}" class="logout-btn">🚪 登出</a>
            </shiro:authenticated>
            <!-- 未登录时显示“登录”链接（也可以放在左侧） -->
            <shiro:guest>
                <a th:href="@{/toLogin}" class="logout-btn" style="background: #1677ff;">🔑 登录</a>
            </shiro:guest>
        </header>

        <!-- 消息区域（来自后端 msg 属性） -->
        <div class="msg-box" th:if="${msg != null}">
            <p th:text="${msg}"></p>
        </div>

        <hr style="border: none; border-top: 1px solid #e8ecf1; margin: 20px 0;">

        <!-- 功能入口卡片（权限控制） -->
        <h3 style="font-weight: 500; color: #1d2129; margin-bottom: 16px;">功能入口</h3>

        <div class="card-grid">
            <!-- 使用 Shiro 权限标签控制显示 -->
            <div shiro:hasPermission="user:add" class="card-item">
                <a th:href="@{/user/add}">➕ Add</a>
                <div class="desc">新增用户</div>
            </div>

            <div shiro:hasPermission="user:update" class="card-item">
                <a th:href="@{/user/update}">✏️ Update</a>
                <div class="desc">更新用户</div>
            </div>

            <!-- 如果没有权限，可显示占位（但 Shiro 标签自动隐藏，无需额外处理） -->
        </div>

        <!-- 如果没有任何权限卡片显示，可给出提示（可选） -->
<!--        <div th:if="${!#authorization.hasPermission('user:add') and !#authorization.hasPermission('user:update')}"-->
<!--             class="no-permission-placeholder">-->
<!--            <p>暂无可用功能，请联系管理员开通权限。</p>-->
<!--        </div>-->
        <shiro:lacksPermission name="user:add">
            <shiro:lacksPermission name="user:update">
                <div class="no-permission-placeholder">
                    <p>暂无可用功能，请联系管理员开通权限。</p>
                </div>
            </shiro:lacksPermission>
        </shiro:lacksPermission>

        <!-- 底部小提示（可选） -->
        <footer style="margin-top: 30px; border-top: 1px solid #e8ecf1; padding-top: 16px; text-align: center; color: #c9cdd4; font-size: 13px;">
            <span>使用 Apache Shiro 进行权限管理</span>
        </footer>
    </div>
</body>
</html>
