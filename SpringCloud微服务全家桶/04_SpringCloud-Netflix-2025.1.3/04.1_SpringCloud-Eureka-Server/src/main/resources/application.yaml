spring:
  application:
    name: @project.artifactId@
server:
  port: 8761


# Spring Boot Actuator 的配置，用于管理和监控应用程序的运行状态。
management:
  endpoint:
    health:
      # 控制健康检查端点的详细信息显示方式
      # 其他可选值：
      #     never：          从不显示详细信息（默认值）
      #     when-authorized：仅对授权用户显示
      #     always：         总是显示详细信息
      show-details: always
  endpoints:
    web:
      base-path: /manage  # 将所有 Actuator 端点的访问路径前缀从默认的 /actuator 改为 /manage。
      exposure:
        # Spring Boot Actuator 默认不通过 Web 暴露任何端点，这里只配置了 health 端点，表示只公开健康检查端点
        # 其他常用端点：
        #     info：      应用基本信息
        #     health：    应用健康信息
        #     metrics：   应用指标
        #     prometheus：Prometheus 格式的指标
        #     env：       环境变量
        #     beans：     所有 Spring beans
        include: '*'


# Eureka 配置
eureka:
  instance:
    # 该配置表示为 Eureka注册时，将使用 IP地址 作为通讯地址，而不是机器的主机名（hostname）。其他服务发现该实例后，会通过 IP地址（例如 192.168.1.5:8080）来调用它。
    prefer-ip-address: true
    # 设置当前实例的主机名。由于上面设置了 prefer-ip-address: true，这个 hostname 实际上不会被用作通讯地址，仅仅作为内部元数据保留。
    hostname: localhost
    # 应用名称。在Eureka界面上显示的服务名称。
    appname: ${spring.application.name}
    # 实例ID。服务实例在注册中心的唯一标识。
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    # 服务心跳续约间隔时间，默认值为 30。客户端会每隔这个时间向 Eureka Server 发送心跳请求，表示自己仍然存活。
    lease-renewal-interval-in-seconds: 30
    # 服务心跳续约过期时间，默认值为 90。如果客户端在这个时间内没有发送心跳请求，Eureka Server 会认为该服务实例已经失效，并将其从注册表中剔除。
    lease-expiration-duration-in-seconds: 90
    # TODO：
    # Eureka 的健康检查机制分为两种模式：
    #   1. 默认模式：基于心跳（自动保活）
    #      Eureka Client 会每隔 30 秒（lease-renewal-interval-in-seconds）主动向 Eureka Server 发送一个 心跳请求（PUT /apps/{appId}/{instanceId}）。
    #      只要这个心跳持续发送，Eureka Server 就默认该服务是 UP（存活） 的。这个过程是完全不依赖 spring-boot-starter-actuator 的 /health 端点。
    #   2. 自定义模式：额外健康检查（可选的“体检”）
    #      status-page-url-path、health-check-url-path 是用于自定义健康检查地址的配置，是用来告诉 Eureka Server “去调用这两个 状态/健康检查 URL 来检查我的状态”。
    #      默认检查路径是 /actuator/info 和 /actuator/health。这里将它们改为 /manage/info 和 /manage/health，以便与 spring-boot-starter-actuator 的管理端点路径保持一致。
    # 如果不配置检查路径，Eureka Server 根本不会去调用 /health 端点，只会安心等待心跳。因此，即使没有 spring-boot-starter-actuator 依赖，也不会报错或影响状态判断。
    # 如果配置了，那么 Eureka Server 会定期调用该接口来更新实例的状态。并且要是服务还没有添加 Actuator依赖，那么 Eureka Server 在发起健康检查请求时会收到 404（或连接拒绝）。
    # Eureka Server 就会认为该实例 不健康（DOWN），并在界面上显示 DOWN 状态。而其他服务通过 Eureka 发现该实例时，会将其视为不可用，从而不会将请求路由给它，导致该服务实际处于“假死”状态（虽然进程还在，但被注册中心隔离了）。
    status-page-url-path: /manage/info     # Eureka Server 的状态页访问路径，该配置必须要搭配 spring-boot-starter-actuator 依赖
    health-check-url-path: /manage/health  # Eureka Server 的健康检查访问路径，该配置必须要搭配 spring-boot-starter-actuator 依赖
  server:
    # 默认值为 true。当网络不稳定导致大量服务心跳失败时，开启后Eureka不会立即剔除这些服务，防止“雪崩”。
    enable-self-preservation: false
    # 默认值为 0.85。当服务实例的续约率低于 85% 时，Eureka 会认为服务不可用并将其剔除。这个阈值可以根据实际情况调整。
    renewal-percent-threshold: 0.85
    # 默认值为 60000 毫秒（1分钟）。Eureka 会每隔这个时间间隔检查一次服务实例的续约状态，剔除不健康的实例。这里设置为 5 秒，便于快速观察服务注册和剔除的效果。
    eviction-interval-timer-in-ms: 60000
    # 默认值为 180 秒（3分钟）。注册表缓存过期时间。客户端拉取的服务注册信息会缓存，此配置控制其过期时间。
    response-cache-auto-expiration-in-seconds: 180
    # 默认值为 true。是否启用只读缓存。Eureka有读写和只读两层缓存，只读缓存用于提升并发读性能
    use-read-only-response-cache: true
    # 默认值为 false。是否禁用增量更新。Eureka支持全量和增量两种服务注册信息更新方式，禁用增量更新后，客户端每次都会拉取完整的服务注册信息。
    disable-delta: false
    # 默认值为 600000 毫秒（10分钟）。Peer节点更新频率。集群模式下，更新其他Eureka Server节点信息的频率。
    peer-eureka-nodes-update-interval-ms: 600000
    # 默认值为 false。是否启用压缩传输。启用后，Eureka Server和客户端之间的通信会使用GZIP压缩算法，减少网络传输量。
    enable-replicated-request-compression: false
  client:
    # 默认值为 true。表示是否启用 Eureka 客户端功能。即使当前应用是 Eureka Server，也需要启用客户端功能来注册自己和获取其他服务信息。
    enabled: true
    # 默认值为 true。表示是否从Eureka Server获取注册的服务信息。作为 单节点注册中心，不需要从自己获取注册信息，因此设置为 false。如果是 高可用集群（多个 Eureka 相互注册），这里必须设为 true，否则无法同步其他节点的服务列表。
    fetch-registry: false
    # 默认值为 true。表示是否将自己注册到Eureka Server。当前节点为注册中心，也可以注册到自己身上。
    register-with-eureka: true
    # 配置 Eureka Server 的服务注册地址。客户端会通过这个地址向 Eureka Server 注册自己，并获取其他服务的信息。
    # 如果当前应用是 Eureka Server 本身，且没有集群节点，那么不配置也不会导致启动失败；但如果是集群模式，则必须配置其他节点的地址，否则无法同步服务注册信息。
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/


# 打开Eureka视图页面 http://127.0.0.1:10086
